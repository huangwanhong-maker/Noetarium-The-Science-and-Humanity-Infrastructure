data-object="5"><ellipse cx="282.6" cy="29.0" rx="30.5" ry="13.0"/><text x="282.6" y="34.0" text-anchor="middle">Person</text></g><g class="k-obj" data-object="6"><ellipse cx="282.6" cy="93.0" rx="46.2" ry="13.0"/><text x="282.6" y="98.0" text-anchor="middle">Collective</text></g><g class="k-obj" data-object="7"><ellipse cx="66.1" cy="29.0" rx="50.1" ry="13.0"/><text x="66.1" y="34.0" text-anchor="middle">Institution</text></g><g class="k-obj" data-object="8"><ellipse cx="66.1" cy="93.0" rx="30.5" ry="13.0"/><text x="66.1" y="98.0" text-anchor="middle">Polity</text></g><g class="k-obj" data-object="9"><ellipse cx="282.6" cy="157.0" rx="22.7" ry="13.0"/><text x="282.6" y="162.0" text-anchor="middle">Work</text></g><g class="k-obj" data-object="10"><ellipse cx="480.6" cy="349.0" rx="38.4" ry="13.0"/><text x="480.6" y="354.0" text-anchor="middle">Artifact</text></g><g class="k-obj" data-object="11"><ellipse cx="480.6" cy="477.0" rx="22.7" ry="13.0"/><text x="480.6" y="482.0" text-anchor="middle">Idea</text></g><g class="k-obj" data-object="12"><ellipse cx="282.6" cy="349.0" rx="34.4" ry="13.0"/><text x="282.6" y="354.0" text-anchor="middle">Concept</text></g><g class="k-obj" data-object="13"><ellipse cx="282.6" cy="541.0" rx="30.5" ry="13.0"/><text x="282.6" y="546.0" text-anchor="middle">Theory</text></g><g class="k-obj" data-object="14"><ellipse cx="282.6" cy="413.0" rx="34.4" ry="13.0"/><text x="282.6" y="418.0" text-anchor="middle">Problem</text></g><g class="k-obj" data-object="15"><ellipse cx="282.6" cy="221.0" rx="42.3" ry="13.0"/><text x="282.6" y="226.0" text-anchor="middle">Tradition</text></g><g class="k-obj" data-object="16"><ellipse cx="66.1" cy="349.0" rx="26.6" ry="13.0"/><text x="66.1" y="354.0" text-anchor="middle">Genre</text></g><g class="k-obj" data-object="17"><ellipse cx="66.1" cy="285.0" rx="30.5" ry="13.0"/><text x="66.1" y="290.0" text-anchor="middle">School</text></g><g class="k-obj" data-object="18"><ellipse cx="282.6" cy="285.0" rx="46.2" ry="13.0"/><text x="282.6" y="290.0" text-anchor="middle">Technology</text></g><g class="k-obj" data-object="19"><ellipse cx="480.6" cy="413.0" rx="38.4" ry="13.0"/><text x="480.6" y="418.0" text-anchor="middle">Practice</text></g><g class="k-obj" data-object="20"><ellipse cx="66.1" cy="157.0" rx="50.1" ry="13.0"/><text x="66.1" y="162.0" text-anchor="middle">Composition</text></g><g class="k-obj" data-object="21"><ellipse cx="66.1" cy="477.0" rx="30.5" ry="13.0"/><text x="66.1" y="482.0" text-anchor="middle">Tuning</text></g><g class="k-obj" data-object="22"><ellipse cx="66.1" cy="413.0" rx="46.2" ry="13.0"/><text x="66.1" y="418.0" text-anchor="middle">Instrument</text></g><g class="k-obj" data-object="23"><ellipse cx="66.1" cy="221.0" rx="22.7" ry="13.0"/><text x="66.1" y="226.0" text-anchor="middle">Text</text></g><g class="k-obj" data-object="24"><ellipse cx="66.1" cy="541.0" rx="38.4" ry="13.0"/><text x="66.1" y="546.0" text-anchor="middle">Doctrine</text></g><g class="k-obj" data-object="25"><ellipse cx="282.6" cy="477.0" rx="38.4" ry="13.0"/><text x="282.6" y="482.0" text-anchor="middle">Argument</text></g></g></svg>