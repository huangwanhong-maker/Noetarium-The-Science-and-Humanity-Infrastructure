><g class="k-set" data-object="3"><rect x="434.0" y="16.0" width="92.2" height="93.0" rx="3"/><text class="k-set-name" x="480.1" y="35.0" text-anchor="middle">Standing</text><line x1="440.0" x2="520.2" y1="42.0" y2="42.0"/><text class="k-element" x="446.0" y="59.0">alleged</text><text class="k-element" x="446.0" y="78.0">proved</text><text class="k-element" x="446.0" y="97.0">presumed</text></g><g class="k-set" data-object="4"><rect x="415.8" y="135.0" width="128.6" height="55.0" rx="3"/><text class="k-set-name" x="480.1" y="154.0" text-anchor="middle">Proceeding</text><line x1="421.8" x2="538.4" y1="161.0" y2="161.0"/><text class="k-element" x="427.8" y="178.0">rivers_v_mill</text></g><g class="k-set" data-object="5"><rect x="39.5" y="216.0" width="61.2" height="93.0" rx="3"/><text class="k-set-name" x="70.1" y="235.0" text-anchor="middle">Trace</text><line x1="45.5" x2="94.7" y1="242.0" y2="242.0"/><text class="k-element" x="51.5" y="259.0">t1</text><text class="k-element" x="51.5" y="278.0">t2</text><text class="k-element" x="51.5" y="297.0">t3</text></g><g class="k-set" data-object="6"><rect x="220.2" y="254.0" width="99.5" height="74.0" rx="3"/><text class="k-set-name" x="270.0" y="273.0" text-anchor="middle">Holding</text><line x1="226.2" x2="313.8" y1="280.0" y2="280.0"/><text class="k-element" x="232.2" y="297.0">form</text><text class="k-element" x="232.2" y="316.0">statement</text></g><g class="k-set" data-object="7"><rect x="227.6" y="173.0" width="84.7" height="55.0" rx="3"/><text class="k-set-name" x="270.0" y="192.0" text-anchor="middle">Manifest</text><line x1="233.6" x2="306.4" y1="199.0" y2="199.0"/><text class="k-element" x="239.6" y="216.0">trace</text></g><g class="k-set" data-object="8"><rect x="23.8" y="54.0" width="92.6" height="55.0" rx="3"/><text class="k-set-name" x="70.1" y="73.0" text-anchor="middle">Inference</text><line x1="29.8" x2="110.4" y1="80.0" y2="80.0"/><text class="k-element" x="35.8" y="97.0">i1</text></g><g class="k-set" data-object="9"><rect x="16.0" y="135.0" width="108.2" height="55.0" rx="3"/><text class="k-set-name" x="70.1" y="154.0" text-anchor="middle">Presumption</text><line x1="22.0" x2="118.2" y1="161.0" y2="161.0"/><text class="k-element" x="28.0" y="178.0">p1</text></g></g></svg>