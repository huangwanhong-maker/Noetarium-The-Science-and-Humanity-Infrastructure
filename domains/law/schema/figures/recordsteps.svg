<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 383" width="726" height="383" role="img" aria-label="A record of facts with its proceeding's steps and findings"><style>/* The default look of categories drawn (visualization/js/categories): hairlines and serif names on whatever ground the page
   has. A page sets the variables to its own palette; each has a fallback, so the drawings stand without one.

     --k-ink      what is drawn            --k-faint    what stands back
     --k-accent   what a claim is about    --k-accent-2 the diagram a cone stands on
     --k-ground   the page beneath a name  --k-line     rules and frames
     --k-serif, --k-mono                   the faces of names and of scripts                                             */

.k-category, .k-strings, .k-sets { display: block; max-width: 100%; height: auto; overflow: visible; font-family: var(--k-serif, 'Source Serif 4', Georgia, serif); }

/* A category: arrows and objects. */
.k-arrow .k-shaft, .k-arrow .k-head { fill: none; stroke: var(--k-ink, #3f2d44); stroke-width: 1.05; stroke-linecap: round; stroke-linejoin: round; }
.k-arrow .k-name { font-size: 12px; font-style: italic; fill: var(--k-ink, #3f2d44); paint-order: stroke; stroke: var(--k-ground, #fbf8fc); stroke-width: 3.2px; stroke-linejoin: round; }
.k-arrow.composite .k-shaft, .k-arrow.composite .k-head { stroke: var(--k-faint, #a493ab); stroke-dasharray: 3 3; }
.k-arrow.composite .k-name { fill: var(--k-faint, #a493ab); }
.k-obj ellipse { fill: var(--k-ground, #fbf8fc); stroke: none; }
.k-obj text { font-size: 14px; fill: var(--k-ink, #3f2d44); }
.k-dot { stroke: var(--k-ground, #fbf8fc); stroke-width: 1; }
.k-arrow:hover .k-shaft, .k-arrow:hover .k-head { stroke: var(--k-accent, #8a5fae); stroke-width: 1.6; }
.k-arrow:hover .k-name { fill: var(--k-accent, #8a5fae); }

/* What a claim is about stands out; with .quiet the rest stands back. */
.k-category.quiet .k-arrow .k-shaft, .k-category.quiet .k-arrow .k-head { stroke: var(--k-faint, #a493ab); }
.k-category.quiet .k-arrow .k-name, .k-category.quiet .k-obj text { fill: var(--k-faint, #a493ab); }
.k-category .k-arrow.shape .k-shaft, .k-category .k-arrow.shape .k-head { stroke: var(--k-accent-2, #c2648f); stroke-width: 1.5; stroke-dasharray: none; }
.k-category .k-arrow.shape .k-name, .k-category .k-obj.shape text { fill: var(--k-accent-2, #c2648f); }
.k-category .k-obj.shape ellipse { stroke: var(--k-accent-2, #c2648f); stroke-width: 1; }
.k-category .k-arrow.leg .k-shaft, .k-category .k-arrow.leg .k-head { stroke: var(--k-accent, #8a5fae); stroke-width: 1.7; stroke-dasharray: none; }
.k-category .k-arrow.leg .k-name, .k-category .k-obj.apex text { fill: var(--k-accent, #8a5fae); font-weight: 600; }
.k-category .k-obj.apex ellipse { stroke: var(--k-accent, #8a5fae); stroke-width: 1.5; fill: color-mix(in srgb, var(--k-accent, #8a5fae) 12%, var(--k-ground, #fbf8fc)); }

/* String diagrams. */
.k-wire { fill: none; stroke: var(--k-ink, #3f2d44); stroke-width: 1.15; }
.k-box { fill: color-mix(in srgb, var(--k-accent, #8a5fae) 10%, var(--k-ground, #fbf8fc)); stroke: var(--k-ink, #3f2d44); stroke-width: 1; }
.k-box-name { font-size: 13px; font-style: italic; fill: var(--k-ink, #3f2d44); }
.k-end { fill: var(--k-ink, #3f2d44); }
.k-type { font-size: 10.5px; fill: var(--k-faint, #a493ab); }
.k-equation { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
.k-sign { font-size: 20px; color: var(--k-faint, #a493ab); }

/* Set-valued functors. */
.k-set rect { fill: color-mix(in srgb, var(--k-accent, #8a5fae) 5%, var(--k-ground, #fbf8fc)); stroke: var(--k-line, #d9cde0); stroke-width: 1; }
.k-set line { stroke: var(--k-line, #d9cde0); stroke-width: 1; }
.k-set-name { font-size: 13.5px; font-weight: 600; fill: var(--k-ink, #3f2d44); }
.k-element { font-size: 12.5px; fill: var(--k-ink, #3f2d44); }
.k-element.empty { font-style: italic; fill: var(--k-faint, #a493ab); }
.k-act { fill: none; stroke-width: 1.5; opacity: 0.92; }

/* Words beside the drawings. */
.k-figure { overflow-x: auto; padding: 2px 0 4px; scrollbar-width: thin; }
.k-pair { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.k-side h5, .k-law h5 { margin: 0 0 2px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--k-faint, #a493ab); }
.k-between { display: flex; flex-direction: column; align-items: center; font-style: italic; color: var(--k-accent, #8a5fae); }
.k-long-arrow { font-size: 22px; line-height: 0.8; font-style: normal; }
.k-maps, .k-equations, .k-facts { margin: 6px 0 0; padding: 0; font-size: 12.5px; color: var(--k-ink, #3f2d44); }
.k-maps span, .k-equations span { display: inline-block; margin: 0 14px 2px 0; white-space: nowrap; }
.k-maps b { margin-right: 10px; font-weight: 600; }
.k-maps.arrows span, .k-equations span { font-style: italic; }
.k-swatch { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 50%; vertical-align: baseline; }
.k-swatch.line { width: 16px; height: 3px; border-radius: 0; vertical-align: middle; }
.k-facts { list-style: none; color: var(--k-faint, #a493ab); }
.k-facts li { display: inline; }
.k-facts li + li::before { content: ' · '; }
.k-note, .k-large { margin: 6px 0 0; font-size: 12.5px; font-style: italic; color: var(--k-faint, #a493ab); }

/* A derivation. */
.k-derivation { margin: 4px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
.k-derivation li { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--k-line, #d9cde0) 60%, transparent); }
.k-step { flex: 0 0 14px; text-align: center; color: var(--k-faint, #a493ab); }
.k-path { flex: 1; font-style: italic; }
.k-edge { padding: 0 1px; }
.k-after { padding: 0 4px; font-style: normal; color: var(--k-faint, #a493ab); }
.k-edge.hit, .k-after.hit { color: var(--k-accent, #8a5fae); background: color-mix(in srgb, var(--k-accent, #8a5fae) 13%, transparent); }
.k-edge.hit { font-weight: 600; }
.k-caret { color: var(--k-accent, #8a5fae); font-weight: 700; }
.k-by { flex: 0 1 auto; font-size: 12px; color: var(--k-faint, #a493ab); }
.k-by.end { font-style: italic; }

/* Tables. */
.k-scroll { max-width: 100%; max-height: 380px; overflow: auto; scrollbar-width: thin; }
.k-table { border-collapse: collapse; font-size: 12.5px; }
.k-table th, .k-table td { padding: 2px 9px; text-align: left; white-space: nowrap; border-bottom: 1px solid color-mix(in srgb, var(--k-line, #d9cde0) 60%, transparent); }
.k-table th { font-weight: 600; color: var(--k-faint, #a493ab); }
.k-table.composition td, .k-table.composition th { text-align: center; font-style: italic; border-right: 1px solid color-mix(in srgb, var(--k-line, #d9cde0) 45%, transparent); }
.k-table.composition tbody th, .k-table.composition thead th { position: sticky; background: var(--k-ground, #fbf8fc); }
.k-table.composition thead th { top: 0; }
.k-table.composition tbody th { left: 0; }
.k-table .corner { font-style: normal; font-size: 11px; }
.k-table td.none { color: var(--k-line, #d9cde0); }
.k-table td.one { color: var(--k-faint, #a493ab); }

/* Theories and their laws. */
.k-generators { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.k-generator { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-style: italic; color: var(--k-faint, #a493ab); }
.k-law { margin-top: 8px; padding-top: 6px; border-top: 1px solid color-mix(in srgb, var(--k-line, #d9cde0) 60%, transparent); }
.k-law h5 em { margin-left: 8px; font-weight: 400; }
.k-law .k-glyph { display: inline-block; width: 16px; }
.k-law.holds h5 { color: var(--k-holds, #5e7f5a); }
.k-law.fails h5 { color: var(--k-fails, #b0406f); }

.title { font: 600 17px 'Source Serif 4', Georgia, serif; fill: #3f2d44; } .note { font: italic 12.5px 'Source Serif 4', Georgia, serif; fill: #7d6a86; }</style><rect width="726" height="383" fill="#fbf8fc"/><text class="title" x="24" y="32">A record of facts with its proceeding's steps and findings</text><text class="note" x="24" y="52">RecordSteps is a category: from 16 generators and 4 equations, completed into 4 rules: 12 objects, 52</text><text class="note" x="24" y="69">arrows; the identities' laws and associativity hold at every instance</text><g class="k-category k-sets" transform="translate(24 86)" font-family="'Source Serif 4', Georgia, serif"><g class="k-arrow generator" data-arrow="12"><path class="k-shaft" d="M275.2 66.7 Q346.8 103.9 415.5 139.7"/><path class="k-head" d="M408.1 139.2 L415.5 139.7 L410.9 133.8"/><text class="k-name" x="341.0" y="117.3" text-anchor="middle">kind</text></g><g class="k-arrow generator" data-arrow="15"><path class="k-shaft" d="M465.7 151.9 Q531.3 151.9 578.2 151.9"/><path class="k-head" d="M571.3 155.0 L578.2 151.9 L571.3 148.9"/><text class="k-name" x="526.6" y="166.9" text-anchor="middle">register</text></g><g class="k-arrow generator" data-arrow="13"><path class="k-shaft" d="M280.3 60.4 Q346.8 71.9 396.8 80.6"/><path class="k-head" d="M389.6 82.4 L396.8 80.6 L390.6 76.4"/><text class="k-name" x="340.8" y="86.0" text-anchor="middle">standing</text></g><g class="k-arrow generator" data-arrow="14"><path class="k-shaft" d="M270.3 69.6 Q346.8 135.9 417.9 197.6"/><path class="k-head" d="M410.7 195.4 L417.9 197.6 L414.7 190.8"/><text class="k-name" x="338.2" y="147.1" text-anchor="middle">within</text></g><g class="k-arrow generator" data-arrow="16"><path class="k-shaft" d="M85.5 170.7 Q160.3 119.9 233.6 70.1"/><path class="k-head" d="M229.7 76.5 L233.6 70.1 L226.3 71.4"/><text class="k-name" x="153.8" y="115.1" text-anchor="middle">of</text></g><g class="k-arrow generator" data-arrow="17"><path class="k-shaft" d="M96.7 183.9 Q160.3 183.9 213.1 183.9"/><path class="k-head" d="M206.3 187.0 L213.1 183.9 L206.3 180.9"/><text class="k-name" x="157.6" y="198.9" text-anchor="middle">held</text></g><g class="k-arrow generator" data-arrow="18"><path class="k-shaft" d="M93.7 191.3 Q258.4 235.7 414.6 163.2"/><path class="k-head" d="M409.7 168.9 L414.6 163.3 L407.1 163.4"/><text class="k-name" x="257.2" y="221.4" text-anchor="middle">shape</text></g><g class="k-arrow generator" data-arrow="19"><path class="k-shaft" d="M92.2 175.0 Q160.3 151.9 218.6 132.1"/><path class="k-head" d="M213.1 137.2 L218.6 132.1 L211.1 131.4"/><text class="k-name" x="161.4" y="167.2" text-anchor="middle">marks</text></g><g class="k-arrow generator" data-arrow="20"><path class="k-shaft" d="M289.6 110.4 Q444.9 68.2 592.5 137.3"/><path class="k-head" d="M585.0 137.2 L592.5 137.4 L587.6 131.7"/><text class="k-name" x="443.9" y="89.1" text-anchor="middle">as</text></g><g class="k-arrow generator" data-arrow="21"><path class="k-shaft" d="M101.1 67.0 Q160.3 85.9 227.7 64.4"/><path class="k-head" d="M222.1 69.5 L227.7 64.5 L220.3 63.6"/><text class="k-name" x="162.4" y="90.8" text-anchor="middle">source</text></g><g class="k-arrow generator" data-arrow="22"><path class="k-shaft" d="M101.1 44.8 Q160.3 25.9 227.7 47.4"/><path class="k-head" d="M220.3 48.2 L227.7 47.4 L222.1 42.4"/><text class="k-name" x="162.4" y="29.0" text-anchor="middle">target</text></g><g class="k-arrow generator" data-arrow="23"><path class="k-shaft" d="M119.9 118.0 Q170.0 116.3 234.2 70.4"/><path class="k-head" d="M230.4 76.9 L234.2 70.5 L226.8 72.0"/><text class="k-name" x="177.0" y="119.7" text-anchor="middle">basic</text></g><g class="k-arrow generator" data-arrow="24"><path class="k-shaft" d="M87.9 104.3 Q150.7 59.5 224.9 56.9"/><path class="k-head" d="M218.2 60.2 L224.9 56.9 L217.9 54.1"/><text class="k-name" x="150.0" y="63.7" text-anchor="middle">presumed</text></g><g class="k-arrow generator" data-arrow="25"><path class="k-shaft" d="M280.3 243.4 Q346.8 231.9 390.7 224.3"/><path class="k-head" d="M384.5 228.5 L390.7 224.3 L383.5 222.5"/><text class="k-name" x="339.3" y="226.1" text-anchor="middle">during</text></g><g class="k-arrow generator" data-arrow="26"><path class="k-shaft" d="M104.6 247.9 Q160.3 247.9 224.9 247.9"/><path class="k-head" d="M218.0 251.0 L224.9 247.9 L218.0 244.9"/><text class="k-name" x="162.5" y="240.9" text-anchor="middle">taken</text></g><g class="k-arrow generator" data-arrow="27"><path class="k-shaft" d="M81.4 232.3 Q160.3 151.9 238.2 72.6"/><path class="k-head" d="M235.6 79.6 L238.2 72.6 L231.2 75.3"/><text class="k-name" x="152.2" y="148.5" text-anchor="middle">finds</text></g><g class="k-obj" data-object="0"><ellipse cx="254.5" cy="55.9" rx="22.7" ry="13.0"/><text x="254.5" y="60.9" text-anchor="middle">Fact</text></g><g class="k-obj" data-object="1"><ellipse cx="439.0" cy="151.9" rx="22.7" ry="13.0"/><text x="439.0" y="156.9" text-anchor="middle">Kind</text></g><g class="k-obj" data-object="2"><ellipse cx="623.5" cy="151.9" rx="38.4" ry="13.0"/><text x="623.5" y="156.9" text-anchor="middle">Register</text></g><g class="k-obj" data-object="3"><ellipse cx="439.0" cy="87.9" rx="38.4" ry="13.0"/><text x="439.0" y="92.9" text-anchor="middle">Standing</text></g><g class="k-obj" data-object="4"><ellipse cx="439.0" cy="215.9" rx="46.2" ry="13.0"/><text x="439.0" y="220.9" text-anchor="middle">Proceeding</text></g><g class="k-obj" data-object="5"><ellipse cx="66.1" cy="183.9" rx="26.6" ry="13.0"/><text x="66.1" y="188.9" text-anchor="middle">Trace</text></g><g class="k-obj" data-object="6"><ellipse cx="254.5" cy="183.9" rx="34.4" ry="13.0"/><text x="254.5" y="188.9" text-anchor="middle">Holding</text></g><g class="k-obj" data-object="7"><ellipse cx="254.5" cy="119.9" rx="38.4" ry="13.0"/><text x="254.5" y="124.9" text-anchor="middle">Manifest</text></g><g class="k-obj" data-object="8"><ellipse cx="66.1" cy="55.9" rx="42.3" ry="13.0"/><text x="66.1" y="60.9" text-anchor="middle">Inference</text></g><g class="k-obj" data-object="9"><ellipse cx="66.1" cy="119.9" rx="50.1" ry="13.0"/><text x="66.1" y="124.9" text-anchor="middle">Presumption</text></g><g class="k-obj" data-object="10"><ellipse cx="254.5" cy="247.9" rx="22.7" ry="13.0"/><text x="254.5" y="252.9" text-anchor="middle">Step</text></g><g class="k-obj" data-object="11"><ellipse cx="66.1" cy="247.9" rx="34.4" ry="13.0"/><text x="66.1" y="252.9" text-anchor="middle">Finding</text></g></g></svg>