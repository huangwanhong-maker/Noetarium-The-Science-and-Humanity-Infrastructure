<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agora</title>
  <meta name="description" content="A market on the map of a city: who could buy, block by block, every place of business, and the kernel between them. Whose custom is whose, where no one serves, where to open next, and how large the market is, from assumptions that are declared.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='13' r='7' fill='%23f6d5cf' stroke='%23c96f62' stroke-width='1.6'/%3E%3Ccircle cx='20' cy='19' r='7' fill='%23e9dcec' stroke='%238f6a9a' stroke-width='1.6' fill-opacity='.8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&display=swap">
  <link rel="stylesheet" href="/visualization/js/board/board.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand" title="Agora: a market on the map of a city">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle class="disc-a" cx="11" cy="13" r="7"/><circle class="disc-b" cx="20" cy="19" r="7"/></svg>
      <span>Agora</span>
    </div>
    <span id="city" class="city"></span>
    <select id="kind" class="kind" aria-label="What is sold"></select>
    <span id="state" class="state" role="status"></span>
    <span class="spacer"></span>
    <nav class="views" aria-label="Questions">
      <button class="key" type="button" data-view="market" title="Who sells, and how much of the spend buys">The market</button>
      <button class="key" type="button" data-view="outlet" title="One outlet: whose custom it is, and where it would go">Whose custom</button>
      <button class="key" type="button" data-view="open" title="A new outlet: what it would sell, and from whom">Where to open</button>
      <button class="key" type="button" data-view="size" title="The size of the market, from data and assumptions">How large</button>
    </nav>
    <span class="rule"></span>
    <button id="open-board" class="key" type="button" title="A board for what is found and what is thought about it">Board</button>
    <button id="theme" class="key" type="button">Night</button>
  </header>
  <main>
    <svg id="map" aria-label="The map"></svg>
    <aside id="assume" class="sheet" aria-label="What is assumed"></aside>
    <aside id="answer" class="sheet" aria-label="What is found"></aside>
    <div id="legend" class="sheet"></div>
    <section id="board-sheet" class="sheet" hidden>
      <div class="board-head"><h2>Board</h2><span id="board-state" class="state"></span><span class="spacer"></span><button id="close-board" class="key" type="button">Close</button></div>
      <div class="board-body"><div id="board" aria-label="The board"></div><nav id="rail" aria-label="Add to the board"></nav></div>
    </section>
    <section id="setup" class="sheet" hidden></section>
    <div id="say" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
