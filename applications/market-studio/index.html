<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Studio</title>
  <meta name="description" content="A studio for the analysis of markets in space and time. A project holds one's data as they are, with their columns bound to roles; slices of space and time; tools with declared parameters, predefined or one's own scripts; what they answered, drawn as layers of a map that moves with a clock and as charts; and boards on which it is written about.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='13' r='7' fill='%23f6d5cf' stroke='%23c96f62' stroke-width='1.6'/%3E%3Ccircle cx='20' cy='19' r='7' fill='%23e9dcec' stroke='%238f6a9a' stroke-width='1.6' fill-opacity='.8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&display=swap">
  <link rel="stylesheet" href="/visualization/js/board/board.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand" title="Market Studio">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle class="disc-a" cx="11" cy="13" r="7"/><circle class="disc-b" cx="20" cy="19" r="7"/></svg>
      <span>Market Studio</span>
    </div>
    <input id="title" class="title" type="text" spellcheck="false" aria-label="The project's title" placeholder="No project">
    <span id="state" class="state" role="status"></span>
    <span class="spacer"></span>
    <label class="slice-pick">Slice <select id="slice" aria-label="The slice in view"></select></label>
    <span class="rule"></span>
    <button id="open-projects" class="key" type="button">Projects</button>
    <button id="theme" class="key" type="button">Night</button>
  </header>
  <main>
    <aside id="explorer" aria-label="The project"></aside>
    <section id="centre">
      <nav id="tabs" class="tabs" aria-label="Views">
        <button class="tab" type="button" data-tab="map">Map</button>
        <button class="tab" type="button" data-tab="table">Table</button>
        <button class="tab" type="button" data-tab="chart">Chart</button>
        <button class="tab" type="button" data-tab="board">Board</button>
        <span id="tab-note" class="tab-note"></span>
      </nav>
      <div id="stage">
        <div id="pane-map" class="pane"><svg id="map" aria-label="The map"></svg><div id="legend"></div><div id="clock" hidden></div></div>
        <div id="pane-table" class="pane" hidden></div>
        <div id="pane-chart" class="pane" hidden></div>
        <div id="pane-board" class="pane" hidden><div id="board" aria-label="The board"></div><nav id="rail" aria-label="Add to the board"></nav></div>
      </div>
      <section id="console" aria-label="What happened"></section>
    </section>
    <aside id="inspector" aria-label="What is selected"></aside>
    <section id="dialog" hidden></section>
    <div id="say" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
