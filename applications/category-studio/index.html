<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Category Studio</title>
  <meta name="description" content="A studio for experiments in category theory. Categories are written by generators and equations or taken from families; functors, natural transformations, set-valued functors and monoidal theories are declared; and every claim is answered with its evidence: a witness, a derivation, or the place where it fails, drawn beside the script.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 9h18M7 23h18M7 9v14M25 9v14' fill='none' stroke='%238a5fae' stroke-width='1.6'/%3E%3Ccircle cx='7' cy='9' r='3' fill='%23f3eaf7' stroke='%238a5fae' stroke-width='1.4'/%3E%3Ccircle cx='25' cy='9' r='3' fill='%23f3eaf7' stroke='%238a5fae' stroke-width='1.4'/%3E%3Ccircle cx='7' cy='23' r='3' fill='%23f3eaf7' stroke='%238a5fae' stroke-width='1.4'/%3E%3Ccircle cx='25' cy='23' r='3' fill='%23f8dfe8' stroke='%23c2648f' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/visualization/js/categories/categories.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand" title="Category Studio">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 9h18M7 23h18M7 9v14M25 9v14"/><circle cx="7" cy="9" r="3"/><circle cx="25" cy="9" r="3"/><circle cx="7" cy="23" r="3"/><circle class="last" cx="25" cy="23" r="3"/>
      </svg>
      <span>Category Studio</span>
    </div>
    <span id="state" class="state" role="status"></span>
    <span class="spacer"></span>
    <label class="pick">Examples <select id="examples" aria-label="An example script"></select></label>
    <label class="pick" id="kept-pick">Kept <select id="kept" aria-label="A script kept on this computer"></select></label>
    <span class="rule"></span>
    <button id="guide-open" class="key" type="button">What one may write</button>
    <button id="theme" class="key" type="button">Night</button>
  </header>

  <main>
    <section id="desk" aria-label="The script">
      <div class="desk-head">
        <input id="name" type="text" spellcheck="false" aria-label="The script's name" placeholder="a script of one's own">
        <button id="keep" class="key edged" type="button" title="Keep this script on this computer, under its name">Keep</button>
        <span class="spacer"></span>
        <label class="live"><input id="live" type="checkbox" checked> as I type</label>
        <button id="run" class="key main" type="button" title="Carry out the script (Ctrl+Enter)">Run</button>
      </div>
      <div class="editor">
        <div id="gutter" aria-hidden="true"></div>
        <textarea id="script" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="The script"></textarea>
      </div>
      <div id="tally" class="tally" role="status"></div>
    </section>
    <section id="sheet" aria-label="What the script answers" aria-live="polite"></section>
  </main>

  <dialog id="guide" aria-label="What one may write">
    <header><h2>What one may write</h2><button id="guide-close" class="key" type="button">Close</button></header>
    <div id="guide-body"></div>
  </dialog>
  <dialog id="setup" aria-label="The engine">
    <h2>The engine is not built</h2>
    <p id="setup-about"></p>
    <p id="setup-state" class="note"></p>
    <div class="row"><button id="setup-run" class="key main" type="button">Build it</button><button id="setup-close" class="key" type="button">Later</button></div>
  </dialog>
</body>
</html>
