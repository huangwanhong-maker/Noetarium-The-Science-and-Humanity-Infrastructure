<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Koinonia · Book agents
  </title>
  <style>
   :root { color-scheme:light; --paper:#f6f5ef; --ink:#1b302e; --muted:#506460; --border:#cdd6ce; --green:#186858; --white:#fffefa}
* { box-sizing:border-box}
body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.45 'Segoe UI',Arial,sans-serif}
main { max-width:1370px; margin:auto; padding:26px clamp(15px,4vw,64px) 40px}
header { display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:2px solid var(--ink); padding-bottom:12px}
header strong { font:600 20px Georgia,serif; letter-spacing:-.04em}
header a { color:var(--green)}
h1 { font:normal clamp(35px,6vw,65px)/1 Georgia,serif; letter-spacing:-.055em; margin:27px 0 9px}
.sub { color:var(--muted); margin:0 0 20px}
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:22px}
.stat { background:var(--white); padding:13px 16px}
.stat b { display:block; font-size:27px; font-variant-numeric:tabular-nums; line-height:1.1}
.stat span { color:var(--muted); font-size:13px}
.filters { display:flex; align-items:end; gap:9px; flex-wrap:wrap}
.filters label { display:flex; flex-direction:column; gap:3px; color:var(--muted); font-size:12px}
.filters input,.filters select { border:1px solid #aabbb2; border-radius:5px; min-height:39px; padding:8px; background:var(--white); color:var(--ink); font:inherit; font-size:14px}
.filters input { width:205px}
.live { margin-left:auto; font-size:12px; color:var(--green); font-variant-numeric:tabular-nums}
.scroller { overflow:auto; border:1px solid var(--border); background:var(--white); border-radius:5px}
table { border-collapse:collapse; width:100%; text-align:left; font-size:14px}
th,td { padding:9px 12px; border-bottom:1px solid #e2e6dc; white-space:nowrap}
th { font-weight:600; font-size:12px; color:#556b60; background:#e9eee6}
tbody tr:last-child td { border-bottom:0}
tbody tr:hover { background:#f3f5ed}
.identity { border:0; background:none; color:var(--green); font:600 14px/1.2 'Segoe UI',sans-serif; cursor:pointer; padding:3px 0; text-decoration:underline; text-underline-offset:3px}
.state { font-weight:600}
.state.running { color:#156653}
.state.waiting { color:#94651b}
.state.ended { color:#686b63}
.info { color:var(--muted); font-size:12px; margin:9px 0}
.last { color:var(--muted)}
dialog { border:1px solid var(--border); border-radius:10px; max-width:650px; width:calc(100% - 32px); max-height:85vh; color:var(--ink); padding:24px; background:var(--white); box-shadow:0 18px 80px #14251f33}
dialog::backdrop { background:#152e2bcc}
dialog h2 { font:normal 32px Georgia,serif; margin:0; overflow-wrap:anywhere}
dialog button { float:right; cursor:pointer; color:var(--green); background:var(--white); border:1px solid var(--border); border-radius:4px; padding:6px 10px}
dialog h3 { font-size:15px; margin:20px 0 6px}
dialog p { white-space:pre-wrap; overflow-wrap:anywhere; margin:5px 0}
dialog ul { list-style:none; padding:0; margin:0}
dialog li { border-top:1px solid var(--border); padding:5px 0; font-size:13px}
.up { color:var(--muted); font-size:13px}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible { outline:3px solid #267e6a; outline-offset:3px}
@media(max-width:650px) { main { padding-top:15px}
.stats { grid-template-columns:repeat(3,1fr)}
.stat { padding:10px}
.stat b { font-size:21px}
.filters label { flex-grow:1}
.filters input { width:100%}
.live { flex-basis:100%; margin:4px 0 0}
th,td { padding:7px 9px}
.sub { font-size:14px}
}
  </style>
 </head>
 <body>
  <main>
   <header>
    <strong>
     Koinonia
    </strong>
    <a href="http://127.0.0.1:9230/c/completion/work" rel="noreferrer" target="_blank">
     Community work board ↗
    </a>
   </header>
   <h1>
    Book agents
   </h1>
   <p class="sub">
    <i>
     Seventeen Goals, Fifteen Years
    </i>
    · Completion community
   </p>
   <div class="stats" id="stats">
   </div>
   <div class="filters">
    <label>
     Find an agent or item
     <input id="query" placeholder="Agent ID or section" type="search"/>
    </label>
    <label>
     Role
     <select id="role">
      <option value="">
       All roles
      </option>
      <option value="writer">
       Writers
      </option>
      <option value="reviewer">
       Reviewers
      </option>
     </select>
    </label>
    <label>
     Session
     <select id="runtime">
      <option value="">
       All sessions
      </option>
     </select>
    </label>
    <label>
     Community state
     <select id="stage">
      <option value="">
       All states
      </option>
     </select>
    </label>
    <label>
     Last action
     <select id="action">
      <option value="">
       All actions
      </option>
     </select>
    </label>
    <span class="live" id="live" role="status">
     Connecting…
    </span>
   </div>
   <p class="info" id="count">
   </p>
   <div class="scroller">
    <table>
     <thead>
      <tr>
       <th>
        Agent
       </th>
       <th>
        Session
       </th>
       <th>
        Community state
       </th>
       <th>
        Work item
       </th>
       <th>
        Last recorded act
       </th>
       <th>
        Model / effort
       </th>
      </tr>
     </thead>
     <tbody id="rows">
     </tbody>
    </table>
   </div>
   <dialog id="detail">
    <button id="close">
     Close
    </button>
    <section id="body">
    </section>
   </dialog>
  </main>
  <script>
   let data
let selected
const el = id => document.getElementById(id)
const time = value => value
  ? new Date(value).toLocaleTimeString('en-GB', {timeZone: 'Asia/Tokyo'}) + ' JST' : '?'

function make(tag, text, className) {
  const node = document.createElement(tag)
  if (text !== undefined) node.textContent = text
  if (className) node.className = className
  return node
}

function selectList(id, entries) {
  const select = el(id)
  const previous = select.value
  const first = select.options[0].cloneNode(true)
  select.replaceChildren(first)
  for (const [value, label] of entries) select.add(new Option(label, value))
  if (entries.some(([value]) => value === previous)) select.value = previous
}

function model(agent) {
  return agent.model + ' ? ' + agent.effort
}

function showDetails() {
  const agent = data.agents.find(row => row.id === selected)
  if (!agent) return
  const box = el('body')
  box.replaceChildren(make('h2', agent.id), make('p', model(agent) + ' ? ' + agent.role, 'up'))
  function section(title, content) {
    box.append(make('h3', title), make('p', content))
  }
  section('Session and community', agent.runtime + ' ? ' + agent.stage)
  if (agent.waitCondition.until) {
    const condition = agent.waitCondition
    const label = {item_change:'Item update', eligible:'Eligible work', work_change:'Work board change',
                   community_change:'Community record change'}[condition.until] || condition.until
    section(agent.unownedWait ? 'Saved wait without a waiting session' : 'Saved wait',
            [label, condition.item].filter(Boolean).join(' ? '))
  }
  section('Latest report', agent.report || 'No agent report yet.')
  if (agent.lastRequest) {
    const r = agent.lastRequest
    section('Latest node request', r.path + ' ? HTTP ' + (r.status ?? 'pending') + ' ? ' + time(r.at))
  }
  box.append(make('h3', 'Recent recorded acts'))
  const list = make('ul')
  for (const act of agent.acts) {
    list.append(make('li', ['#' + act.n, act.kind, act.item, time(act.at)].filter(Boolean).join(' ? ')))
  }
  if (!agent.acts.length) list.append(make('li', 'No act recorded under this passport yet.'))
  box.append(list)
}

function render() {
  if (!data) return
  const query = el('query').value.trim().toLowerCase()
  const fragment = document.createDocumentFragment()
  let count = 0
  for (const agent of data.agents) {
    const last = agent.acts[0]
    const action = last?.kind || 'No recorded act'
    if (['role', 'runtime', 'stage'].some(key => el(key).value && el(key).value !== agent[key])) continue
    if (el('action').value && el('action').value !== action) continue
    if (query && ![agent.id, agent.item, agent.waitCondition.item].join(' ').toLowerCase().includes(query)) continue
    const row = make('tr')
    const name = make('button', agent.id, 'identity')
    name.onclick = () => {
      selected = agent.id
      showDetails()
      if (!el('detail').open) el('detail').showModal()
    }
    const identity = make('td')
    identity.append(name)
    row.append(identity, make('td', agent.runtime, 'state ' + agent.runtime.toLowerCase()),
               make('td', agent.stage), make('td', agent.item || '?'),
               make('td', last ? action + ' ? #' + last.n : '?', 'last'), make('td', model(agent)))
    fragment.append(row)
    count++
  }
  if (!count) {
    const row = make('tr')
    const cell = make('td', 'No agents match these filters.')
    cell.colSpan = 6
    row.append(cell)
    fragment.append(row)
  }
  el('rows').replaceChildren(fragment)
  el('count').textContent = count + ' of ' + data.counts.total + ' agents ? Select an agent for its report and recent acts.'
  if (selected && el('detail').open) showDetails()
}

async function refresh() {
  try {
    const response = await fetch('/api/status', {cache:'no-store'})
    if (!response.ok) throw Error(response.status)
    data = await response.json()
    const c = data.counts
    const metrics = [['Agents', c.total], ['Running sessions', c.running], ['Waiting sessions', c.waiting],
                     ['Unowned saved waits', c.unownedWaits], ['Passports presented', c.presented],
                     ['Agents with deliveries', c.delivered]]
    el('stats').replaceChildren(...metrics.map(([label, value]) => {
      const card = make('div', undefined, 'stat')
      card.append(make('b', value), make('span', label))
      return card
    }))
    for (const key of ['runtime', 'stage']) {
      const values = [...new Set(data.agents.map(agent => agent[key]))].sort()
      selectList(key, values.map(v => [v,v]))
    }
    selectList('action', Object.entries(c.lastActions).sort().map(([k,n]) => [k,k + ' (' + n + ')']))
    el('live').textContent = 'Updated ' + time(data.asOf)
    render()
  } catch {
    el('live').textContent = data ? 'Connection interrupted ? Last update ' + time(data.asOf) : 'Waiting for the local monitor?'
  } finally {
    setTimeout(refresh, 10000)
  }
}

for (const id of ['query','role','runtime','stage','action']) el(id).addEventListener('input', render)
el('close').onclick = () => el('detail').close()
el('detail').addEventListener('close', () => { selected = null })
refresh()
  </script>
 </body>
</html>
