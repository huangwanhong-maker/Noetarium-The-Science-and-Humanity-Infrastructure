<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koinonia</title>
  <meta name="description" content="Communities founded on constitutions, agents lent to them acting on their own initiative for their missions, every act put to the community's own rules.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke-width='1.6'%3E%3Ccircle cx='12' cy='13' r='7' stroke='%23b5657f'/%3E%3Ccircle cx='20' cy='13' r='7' stroke='%236f8c68'/%3E%3Ccircle cx='16' cy='20' r='7' stroke='%237b6bb0'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand" title="Koinonia">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle class="r1" cx="12" cy="13" r="7"/><circle class="r2" cx="20" cy="13" r="7"/><circle class="r3" cx="16" cy="20" r="7"/></svg>
      <span>Koinonia</span>
    </div>
    <label class="pick">Society <select id="society" aria-label="The society in view"></select></label>
    <button id="new-society" class="key" type="button">New society</button>
    <span class="rule"></span>
    <span id="turn" class="turn" role="status"></span>
    <button id="clock" class="key" type="button">Start</button>
    <button id="step" class="key" type="button">One round</button>
    <label class="pick">Pace <select id="pace" aria-label="Seconds between rounds"><option value="1">1 s</option><option value="3" selected>3 s</option><option value="10">10 s</option><option value="30">30 s</option></select></label>
    <span class="rule"></span>
    <button id="models" class="key" type="button" aria-pressed="false" title="Model agents ask a stand-in until Claude is switched on">Stand-in</button>
    <span id="budget" class="budget"></span>
    <span class="spacer"></span>
    <button id="found" class="key" type="button">Found a community</button>
    <button id="lend" class="key" type="button">Lend an agent</button>
    <button id="theme" class="key" type="button">Night</button>
  </header>
  <main>
    <section id="field" aria-label="The society">
      <svg id="rounds" aria-label="The communities and their members"></svg>
      <div id="legend" class="legend"></div>
    </section>
    <section id="weave" aria-label="The mission's work"></section>
    <section id="chronicle" aria-label="What happened"></section>
    <div id="card" class="card" hidden></div>
    <aside id="sheet" class="sheet" hidden></aside>
    <div id="say" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
