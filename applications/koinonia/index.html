<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koinonia</title>
  <meta name="description" content="Communities founded on constitutions, agents and persons acting in them, every act put to the community's own rules and every behaviour recorded.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke-width='1.1'%3E%3Ccircle cx='12' cy='13' r='7' stroke='%23b4627f'/%3E%3Ccircle cx='20' cy='13' r='7' stroke='%236f8f68'/%3E%3Ccircle cx='16' cy='20' r='7' stroke='%236f62a8'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..500&family=IBM+Plex+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand" title="Koinonia">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle class="r1" cx="12" cy="13" r="7"/><circle class="r2" cx="20" cy="13" r="7"/><circle class="r3" cx="16" cy="20" r="7"/></svg>
      <span class="name">Koinonia</span>
    </div>
    <div class="title-block">
      <select id="society" class="society" aria-label="The society in view"></select>
      <span id="turn" class="turn" role="status"></span>
    </div>
    <nav class="controls" aria-label="The society's clock and the person's acts">
      <button id="clock" class="link" type="button">begin</button>
      <button id="step" class="link" type="button">one round</button>
      <label class="link quiet">pace <select id="pace" aria-label="Seconds between rounds"><option value="1">1 s</option><option value="3" selected>3 s</option><option value="10">10 s</option><option value="30">30 s</option></select></label>
      <span class="sep" aria-hidden="true">·</span>
      <button id="models" class="link" type="button" aria-pressed="false" title="Agents by model ask a stand-in until Claude is switched on">stand-in</button>
      <span id="budget" class="budget"></span>
      <span class="sep" aria-hidden="true">·</span>
      <button id="take-part" class="link strong" type="button">take part</button>
      <button id="found" class="link" type="button">found a community</button>
      <button id="lend" class="link" type="button">lend an agent</button>
      <button id="new-society" class="link" type="button">a new society</button>
      <span class="sep" aria-hidden="true">·</span>
      <button id="theme" class="link" type="button">night</button>
    </nav>
  </header>
  <main>
    <section id="society-pane" aria-label="The society">
      <div id="focus-head" class="focus-head"></div>
      <figure class="plate">
        <svg id="rounds" aria-label="The communities, their members and what passes between them"></svg>
        <figcaption id="plate-caption" class="plate-caption"></figcaption>
      </figure>
      <div id="legend" class="legend" aria-label="Key"></div>
      <section id="weave" aria-label="The mission's work"></section>
    </section>
    <section id="story-pane" aria-label="What happened">
      <nav class="tabs">
        <button class="tab on" type="button" data-tab="story">The annals</button>
        <button class="tab" type="button" data-tab="journal">The ledger of behaviour</button>
        <span id="story-who" class="who"></span>
      </nav>
      <div id="chips" class="chips"></div>
      <div id="story" class="story"></div>
      <div id="journal" class="journal" hidden></div>
    </section>
    <div id="card" class="card" hidden></div>
    <aside id="sheet" class="sheet" hidden></aside>
    <div id="say" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
