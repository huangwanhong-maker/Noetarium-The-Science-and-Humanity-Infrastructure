<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Law Studio</title>
  <meta name="description" content="A studio for legal practice, matter by matter: documents and exhibits kept with their digests and chains of custody; passages recognised as evidence, by hand or proposed by a language model and each found in its document; a body of law stated clause by clause; open terms read with the courts&#8217; holdings weighed for the forum; each question clear, arguable or untenable with what it rests on; the plan of proof; and the evidence in space and time, with theories of the case found by an evolutionary search and tested on what was held back; and theories of the law, doctrines that best fit the case law, tested on the decisions given after the matter. International privacy law first.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 4 H24 V28 H8 Z' fill='%23f6eef2' stroke='%238e3b5e' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M12 11 H20 M12 15 H20' stroke='%238e3b5e' stroke-width='1.1'/%3E%3Cpath d='M16 19 L20 23 L16 27 L12 23 Z' fill='none' stroke='%236f6ba8' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/visualization/js/board/board.css">
  <link rel="stylesheet" href="/visualization/js/evidence/evidence.css">
  <link rel="stylesheet" href="/visualization/js/evidence/spacetime.css">
  <link rel="stylesheet" href="/visualization/js/evidence/doctrine.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="views.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand" title="Law Studio">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path class="folio" d="M8 4 H24 V28 H8 Z"/>
        <path class="fold" d="M12 11 H20 M12 15 H20"/>
        <path class="seal" d="M16 19 L20 23 L16 27 L12 23 Z"/>
      </svg>
      <span>Law Studio</span>
    </div>
    <input id="title" class="title" type="text" spellcheck="false" aria-label="The project's title" placeholder="No project">
    <span id="state" class="state" role="status"></span>
    <span class="spacer"></span>
    <label class="slice-pick">Slice <select id="slice" aria-label="The slice in view"></select></label>
    <span class="rule"></span>
    <button id="open-projects" class="key" type="button">Projects</button>
    <button id="theme" class="key" type="button">Night</button>
  </header>
  <main>
    <aside id="explorer" aria-label="The project"></aside>
    <section id="centre">
      <nav id="tabs" class="tabs" aria-label="Views">
        <button class="tab" type="button" data-tab="map">Map</button>
        <button class="tab" type="button" data-tab="table">Table</button>
        <button class="tab" type="button" data-tab="chart">Chart</button>
        <button class="tab" type="button" data-tab="board">Board</button>
        <span id="tab-note" class="tab-note"></span>
      </nav>
      <div id="stage">
        <div id="pane-map" class="pane"><svg id="map" aria-label="The map"></svg><div id="legend"></div><div id="clock" hidden></div></div>
        <div id="pane-table" class="pane" hidden></div>
        <div id="pane-chart" class="pane" hidden></div>
        <div id="pane-board" class="pane" hidden><div id="board" aria-label="The board"></div><nav id="rail" aria-label="Add to the board"></nav></div>
      </div>
      <section id="console" aria-label="What happened"></section>
    </section>
    <aside id="inspector" aria-label="What is selected"></aside>
    <section id="dialog" hidden></section>
    <div id="say" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
