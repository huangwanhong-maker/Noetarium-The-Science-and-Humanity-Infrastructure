<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histos Harmonia</title>
  <meta name="description" content="An archive of historical objects and a place to learn from it. Every object is asked what problem it answers, why that problem arose, what made it answerable and what it made possible; what is said of it is kept with who says it and how it stands.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 6v20M13 6v20M19 6v20M26 6v20' fill='none' stroke='%236b5fa8' stroke-width='1.3'/%3E%3Cpath d='M4 11c6-3 8 3 12 0s6-3 12 0M4 21c6 3 8-3 12 0s6 3 12 0' fill='none' stroke='%23b5566b' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/visualization/js/history/history.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <!-- The selvedge: the thin edge of the cloth, where the work is named and the way of seeing is chosen. -->
  <header class="selvedge">
    <div class="brand" title="Histos Harmonia: a loom of history">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path class="warp" d="M6 6v20M13 6v20M19 6v20M26 6v20"/>
        <path class="weft" d="M4 11c6-3 8 3 12 0s6-3 12 0M4 21c6 3 8-3 12 0s6 3 12 0"/>
      </svg>
      <span>Histos Harmonia</span>
    </div>
    <select id="record" class="record" aria-label="The record read"></select>
    <nav class="views" id="views" aria-label="Ways of seeing">
      <button data-view="map" type="button">Map</button>
      <button data-view="loom" type="button">Loom</button>
      <button data-view="cone" type="button">Cone</button>
      <button class="desk-only" data-view="desk" type="button">Desk</button>
    </nav>
    <span class="spacer"></span>
    <div class="layers" id="layers" role="group" aria-label="How much of the record is read">
      <button data-layer="established" type="button" title="What a documentary source or two confirmed sources state, and none disputes">established <b></b></button>
      <button data-layer="attested" type="button" title="With what a source states and no one has yet confirmed, or one source alone">+ attested <b></b></button>
      <button data-layer="proposed" type="button" title="With what a language model proposes from memory, unconfirmed">+ proposed <b></b></button>
    </div>
    <button id="find-open" class="plain" type="button" title="Find an object (press /)">Find <kbd>/</kbd></button>
    <button id="night" class="plain" type="button" title="Day or night">◐</button>
  </header>

  <!-- The stage: the record drawn, edge to edge; what is chosen opens on it. -->
  <main class="stage" id="stage">
    <div class="view" id="view"></div>
    <div class="tools" id="tools"></div>
    <nav class="trail" id="trail" aria-label="The thread you have followed"></nav>
    <div class="notice" id="notice" hidden></div>
    <div class="fan" id="fan" hidden></div>
    <div class="petals" id="petals" hidden></div>
    <aside class="card" id="card" hidden aria-label="The object chosen"></aside>
    <footer class="clock" id="clock">
      <div class="questions" id="questions" aria-live="polite"></div>
      <div class="shuttle">
        <button id="play" class="plain" type="button" title="Let the years run">▷</button>
        <output id="year-text" class="year"></output>
        <input id="year" type="range" aria-label="The year looked at">
        <div class="legend" id="legend"></div>
      </div>
    </footer>
  </main>

  <!-- A room: one object and one thing done with it, on a page of its own. -->
  <section class="room" id="room" hidden aria-label="A page for one object"></section>

  <div class="palette" id="palette" hidden>
    <div class="palette-box">
      <input id="find" type="search" placeholder="Find an object by its name, in any script" aria-label="Find an object">
      <div class="kinds" id="kinds"></div>
      <ol id="list" class="list"></ol>
    </div>
  </div>

  <footer class="tour" id="tour" hidden></footer>
  <div id="setup" class="setup" hidden></div>
</body>
</html>
