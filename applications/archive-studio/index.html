<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive Studio</title>
  <meta name="description" content="A studio for archives, project by project: holdings of any kind (images, sound, video, documents, tables) kept with their digests, described and annotated as linked data; images read in deep zoom from its own IIIF service; descriptions in Dublin Core, Records in Contexts or CIDOC CRM; an arrangement checked by archeion, written as EAD and packed as BagIt; chains of custody; codebooks of its tables (DDI); graphs of RDF and JSON-LD drawn, edited, queried in SPARQL, checked by SHACL shapes and reasoned over; a catalogue of social-science studies; analyses of cases, coded texts, scales and models; several people on one archive.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 4 H20 L26 10 V28 H8 Z' fill='%23f3ecf4' stroke='%237d5a9e' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M20 4 V10 H26' fill='none' stroke='%237d5a9e' stroke-width='1.3'/%3E%3Ccircle cx='17' cy='20' r='3.2' fill='none' stroke='%23b9607e' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/visualization/js/board/board.css">
  <link rel="stylesheet" href="/visualization/js/linked/linked.css">
  <link rel="stylesheet" href="/visualization/js/iiif/iiif.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="views.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand" title="Archive Studio">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path class="folio" d="M8 4 H20 L26 10 V28 H8 Z"/>
        <path class="fold" d="M20 4 V10 H26"/>
        <circle class="seal" cx="17" cy="20" r="3.2"/>
      </svg>
      <span>Archive Studio</span>
    </div>
    <input id="title" class="title" type="text" spellcheck="false" aria-label="The project's title" placeholder="No project">
    <span id="state" class="state" role="status"></span>
    <span class="spacer"></span>
    <label class="slice-pick">Slice <select id="slice" aria-label="The slice in view"></select></label>
    <span class="rule"></span>
    <button id="open-projects" class="key" type="button">Projects</button>
    <button id="theme" class="key" type="button">Night</button>
  </header>
  <main>
    <aside id="explorer" aria-label="The project"></aside>
    <section id="centre">
      <nav id="tabs" class="tabs" aria-label="Views">
        <button class="tab" type="button" data-tab="map">Map</button>
        <button class="tab" type="button" data-tab="table">Table</button>
        <button class="tab" type="button" data-tab="chart">Chart</button>
        <button class="tab" type="button" data-tab="board">Board</button>
        <span id="tab-note" class="tab-note"></span>
      </nav>
      <div id="stage">
        <div id="pane-map" class="pane"><svg id="map" aria-label="The map"></svg><div id="legend"></div><div id="clock" hidden></div></div>
        <div id="pane-table" class="pane" hidden></div>
        <div id="pane-chart" class="pane" hidden></div>
        <div id="pane-board" class="pane" hidden><div id="board" aria-label="The board"></div><nav id="rail" aria-label="Add to the board"></nav></div>
      </div>
      <section id="console" aria-label="What happened"></section>
    </section>
    <aside id="inspector" aria-label="What is selected"></aside>
    <section id="dialog" hidden></section>
    <div id="say" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
