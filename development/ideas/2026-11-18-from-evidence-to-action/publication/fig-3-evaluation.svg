<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 556" width="1260" height="556" role="img" aria-label="Evaluation: operators on the estimated state, in parallel">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4A3A52"/></marker>
    <marker id="lilac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#7864B0"/></marker>
    <marker id="orchid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#9C5590"/></marker>
    <style>
      text { font-family: 'Source Serif 4', Georgia, 'Cambria Math', 'STIX Two Text', serif; fill: #2E2233; }
      .h { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .m { font-size: 13px; text-anchor: middle; }
      .s { font-size: 11.5px; fill: #5E4C68; text-anchor: middle; }
      .i { font-size: 11.5px; font-style: italic; fill: #6E5C78; text-anchor: middle; }
      .lab { font-size: 11.5px; font-style: italic; }
      .th { font-size: 11px; font-style: italic; fill: #6E5C78; }
      .ex { font-size: 13px; font-weight: 600; }
      .g { font-size: 12px; fill: #3F2D44; }
      .v { font-size: 12.5px; }
      .sc { font-size: 12px; font-style: italic; fill: #5E4C68; }
      .box { fill: #FFFFFF; stroke: #2E2233; stroke-width: 1; }
      .flow { fill: none; stroke: #4A3A52; stroke-width: 1.2; }
      .fan { fill: none; stroke: #4A3A52; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1260" height="556" fill="#FFFFFF"/>

  <!-- the three arguments -->
  <text class="i" x="130" y="222">estimated state</text>
  <rect class="box" x="60" y="232" width="140" height="56" rx="3"/>
  <text class="m" x="130" y="265" font-size="15">b ∈ T S</text>
  <path class="flow" d="M200,260 H298" marker-end="url(#ink)"/>
  <text class="lab" x="249" y="251" text-anchor="middle" fill="#4A3A52">state</text>

  <rect x="330" y="46" width="160" height="54" rx="3" fill="#FFFFFF" stroke="#7864B0" stroke-width="1.2"/>
  <text class="h" x="410" y="70">readings ι</text>
  <text class="s" x="410" y="89">each with its source</text>
  <path d="M410,100 V198" fill="none" stroke="#7864B0" stroke-width="1.4" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#lilac)"/>
  <text class="lab" x="418" y="154" fill="#7864B0">meaning</text>

  <rect x="330" y="420" width="160" height="54" rx="3" fill="#FCF5FA" stroke="#9C5590" stroke-width="1.2"/>
  <text class="h" x="410" y="444">standards σ</text>
  <text class="s" x="410" y="463">each with its holder</text>
  <path d="M410,420 V322" fill="none" stroke="#9C5590" stroke-width="1.2" marker-end="url(#orchid)"/>
  <text class="lab" x="418" y="375" fill="#9C5590">value</text>

  <!-- the operators -->
  <rect class="box" x="300" y="200" width="220" height="120" rx="3" stroke-width="1.3"/>
  <text x="410" y="254" font-size="20" text-anchor="middle">J<tspan baseline-shift="sub" font-size="12">k</tspan>(b; ι, σ)</text>
  <text class="s" x="410" y="279">one operator per evaluation</text>
  <text class="i" x="410" y="298">deterministic</text>

  <!-- the fan: what each operator yields -->
  <path class="fan" d="M520,236 C570,236 580,146 630,146" marker-end="url(#ink)"/>
  <path class="fan" d="M520,248 C570,248 580,192 630,192" marker-end="url(#ink)"/>
  <path class="fan" d="M520,260 C570,260 580,238 630,238" marker-end="url(#ink)"/>
  <path class="fan" d="M520,272 C570,272 580,284 630,284" marker-end="url(#ink)"/>
  <path class="fan" d="M520,284 C570,284 580,330 630,330" marker-end="url(#ink)"/>

  <rect x="620" y="96" width="460" height="262" rx="3" fill="#FFFFFF" stroke="#B9A9C2" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text class="th" x="636" y="118">examples, declared with their operators</text>
  <text class="th" x="890" y="118">V<tspan baseline-shift="sub" font-size="8">k</tspan></text>
  <text class="th" x="1000" y="118">scale</text>

  <text class="ex" x="640" y="150">features</text><text class="g" x="724" y="150">a reading of “resilient”</text>
  <text class="v" x="890" y="150">ℝ<tspan baseline-shift="sub" font-size="9">≥0</tspan></text><text class="sc" x="1000" y="150">ratio</text>
  <text class="ex" x="640" y="196">needs</text><text class="g" x="724" y="196">a gap under a standard</text>
  <text class="v" x="890" y="196">{met, unmet}</text><text class="sc" x="1000" y="196">nominal</text>
  <text class="ex" x="640" y="242">problems</text><text class="g" x="724" y="242">states warranting action</text>
  <text class="v" x="890" y="242">L(G)</text><text class="sc" x="1000" y="242">nominal</text>
  <text class="ex" x="640" y="288">risks</text><text class="g" x="724" y="288">exceedance probability</text>
  <text class="v" x="890" y="288">[0, 1]</text><text class="sc" x="1000" y="288">absolute</text>
  <text class="ex" x="640" y="334">assets</text><text class="g" x="724" y="334">strengths, ranked</text>
  <text class="v" x="890" y="334">{1, …, 5}</text><text class="sc" x="1000" y="334">ordinal</text>

  <!-- uptake -->
  <path class="flow" d="M1080,260 H1108" marker-end="url(#ink)"/>
  <rect class="box" x="1110" y="216" width="130" height="88" rx="3" stroke="#B8577F" stroke-width="1.5"/>
  <text class="h" x="1175" y="242">Policy making</text>
  <text class="s" x="1175" y="263">uptake: a holder’s</text>
  <text class="s" x="1175" y="279">commitment to act</text>
  <text class="s" x="1175" y="295">on an evaluation</text>

  <!-- composite operator -->
  <text class="th" x="636" y="414">composite operator</text>
  <text class="m" x="680" y="470">T S</text>
  <text class="m" x="860" y="470">T F<tspan baseline-shift="sub" font-size="9">ι</tspan></text>
  <text class="m" x="1040" y="470">V<tspan baseline-shift="sub" font-size="9">need</tspan></text>
  <path class="flow" d="M702,465 H834" marker-end="url(#ink)"/>
  <text class="lab" x="768" y="456" text-anchor="middle">Tφ<tspan baseline-shift="sub" font-size="8">ι</tspan></text>
  <path class="flow" d="M886,465 H1012" marker-end="url(#ink)"/>
  <text class="lab" x="949" y="456" text-anchor="middle">gap<tspan baseline-shift="sub" font-size="8">σ</tspan></text>
  <path class="flow" d="M686,478 C720,530 1000,530 1036,480" marker-end="url(#ink)"/>
  <text class="lab" x="860" y="536" text-anchor="middle">J<tspan baseline-shift="sub" font-size="8">need</tspan> = gap<tspan baseline-shift="sub" font-size="8">σ</tspan> ∘ Tφ<tspan baseline-shift="sub" font-size="8">ι</tspan></text>
</svg>
