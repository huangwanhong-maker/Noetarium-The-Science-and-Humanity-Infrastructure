><g class="k-obj" data-object="20"><ellipse cx="268.0" cy="509.0" rx="26.6" ry="13.0"/><text x="268.0" y="514.0" text-anchor="middle">Trace</text></g><g class="k-obj" data-object="21"><ellipse cx="62.2" cy="413.0" rx="30.5" ry="13.0"/><text x="62.2" y="418.0" text-anchor="middle">Object</text></g><g class="k-obj" data-object="22"><ellipse cx="62.2" cy="477.0" rx="42.3" ry="13.0"/><text x="62.2" y="482.0" text-anchor="middle">Recording</text></g><g class="k-obj" data-object="23"><ellipse cx="62.2" cy="541.0" rx="38.4" ry="13.0"/><text x="62.2" y="546.0" text-anchor="middle">Document</text></g><g class="k-obj" data-object="24"><ellipse cx="62.2" cy="605.0" rx="42.3" ry="13.0"/><text x="62.2" y="610.0" text-anchor="middle">Testimony</text></g><g class="k-obj" data-object="25"><ellipse cx="62.2" cy="669.0" rx="22.7" ry="13.0"/><text x="62.2" y="674.0" text-anchor="middle">Data</text></g></g></svg>