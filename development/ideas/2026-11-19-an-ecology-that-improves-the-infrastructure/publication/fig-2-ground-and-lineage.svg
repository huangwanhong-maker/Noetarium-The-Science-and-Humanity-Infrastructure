      .pl { font-size: 15px; font-weight: 600; fill: #6E5C78; }
      .num { font-size: 11px; fill: #3F2D44; text-anchor: middle; }
      .ax { font-size: 11px; fill: #6E5C78; text-anchor: middle; }
      .axe { font-size: 11px; fill: #6E5C78; text-anchor: end; }
      .axl { font-size: 11px; fill: #6E5C78; }
